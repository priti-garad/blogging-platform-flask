
<!DOCTYPE html>
<html>
<head>
    <title>Create Blog - Blogging Platform</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            padding: 40px;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        input, textarea {
            width: 95%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 180px;
        }

        button {
            background: #263b80;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        a {
            color: #263b80;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Create Your Blog Post</h1>

    <form method="POST">

        <label>Blog Title</label>
        <input type="text" name="title"
               placeholder="Enter blog title" required>

        <label>Blog Content</label>
        <textarea name="content"
                  placeholder="Write your blog here..."
                  required></textarea>

        <button type="submit">Publish Blog</button>

    </form>

    <p><a href="/">Back to Home</a></p>

</div>

</body>
</html>
